[project]
name = "dataroom-lens"
version = "0.1.0"
description = "DataRoom Lens backend: verified diligence findings over one data room."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "fastembed>=0.4",
    "pymupdf>=1.24",
    "pyyaml>=6",
    "anthropic>=1.0",
    "typer>=0.12",
]

[project.scripts]
lens = "app.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tools", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["app", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.domain", "app.domain.*", "app.verify", "app.verify.*"]
# mypy's strict flags spelled out: `strict = true` in an override leaks
# disallow_untyped_calls onto modules that import these (mypy 2.3).
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a Postgres with pgvector at DATABASE_URL"]
# PyMuPDF's SWIG bindings warn on import under Python 3.12.
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
