id: export_capacity_consistent
order: 3
severity: high
headline_phrase: "the grid will not accept the capacity the project is modelled on"

inputs:
  - key: export_capacity
    select: {property_group: Asset.export_capacity_mw}   # every verified value, all documents
    role_by_document:
      planning: "permitted capacity"
      ppa: "contracted capacity"
      grid: "grid export limit"
    order: majority_first       # corroborated values first, then conflicting ones

logic: |
  values = distinct verified values of export_capacity
  if none:           missing_evidence
  elif len(values)>1: conflict        (refuse to guess: never pick a winner)
  else:              pass

context:
  majority_value: 'value held by the most documents, formatted "49.9"'
  majority_count_word: 'number of documents holding it, as a word: "two"'
  majority_where: '"two documents", or the noun of the only document holding it: "the PPA"'
  majority_docs_text: 'manifest nouns joined, first letter capitalised: "Planning and the PPA"'
  minority_value: 'the other value: "45"'
  minority_doc: 'manifest noun of the document holding it: "the grid offer"'
  overstatement_pct: "round((majority - minority) / majority * 100), e.g. 10"
  source_count_word: 'number of verified values (one per document), capitalised word: "Three"'

title:
  flagged: "Export capacity is {majority_value} MW in {majority_where} and {minority_value} MW in {minority_doc}"
  passed: "Export capacity is consistent across documents"
why: >-
  Revenue modelled on {majority_value} MW may be overstated by about {overstatement_pct}%
  if the grid only accepts {minority_value} MW.
how: >-
  {source_count_word} verified values for the same property disagree. The system does not pick a
  winner: it returns conflict with every source and routes it to a reviewer. A lawyer
  may decide these are different properties, which is exactly what a correction records.

rfi:
  title: "Confirm export capacity"
  request: >-
    Please confirm the intended export capacity and whether an increase to the
    {minority_value} MW Maximum Export Capacity has been applied for.
  why: "{majority_docs_text} assume {majority_value} MW; {minority_doc} permits {minority_value} MW."
  documents_expected:
    - "Any variation to the connection offer"
    - "Correspondence with the network operator on capacity"
