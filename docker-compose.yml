services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lens
      POSTGRES_PASSWORD: lens
      POSTGRES_DB: lens
    ports:
      - "${LENS_DB_PORT:-5432}:5432"  # override if 5432 is taken locally
    volumes:
      - lens-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lens -d lens"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  lens-db:
