services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lens
      POSTGRES_PASSWORD: lens
      POSTGRES_DB: lens
    ports:
      - "${LENS_DB_PORT:-5432}:5432"  # override if 5432 is taken locally
    volumes:
      - lens-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lens -d lens"]
      interval: 2s
      timeout: 3s
      retries: 20

  # The deployed image, run locally: docker compose --profile app up --build
  app:
    profiles: [app]
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://lens:lens@db:5432/lens
    ports:
      - "${LENS_APP_PORT:-8000}:8000"
    command: ["sh", "-c", "lens release; exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"]

volumes:
  lens-db:
