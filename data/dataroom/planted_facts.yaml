    finding: F-05
    evidence: ["planning:p3:¶6", "missing"]
    context:
      condition_number: "5"
      condition_subject: "Construction Traffic Management Plan"
      rfi_id: "RFI-02"
  permission_in_force:
    result: pass
    context: {condition_number: "1", deadline_short: "12 Jun 2027"}
  parties_consistent:
    result: pass
