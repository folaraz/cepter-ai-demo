# Things that must NOT be extracted (a model that invents these is wrong)
absent:
  - "any Easement node (the data room has no easement)"
  - "Condition 5 discharged_on (no discharge exists)"
  - "a second export capacity figure from the grid offer's import capacity (20 MW is import)"

consolidation:
  merges:
    - {node: Party, canonical: "John Hartley", variants: ["JOHN HARTLEY", "Mr J. Hartley", "John Hartley"]}
    - {node: Party, canonical: "Brackenfield Solar Limited", variants: ["Brackenfield Solar Limited", "Brackenfield Solar Ltd"]}
  conflicts:
    - property: Asset.export_capacity_mw
      corroborated: {value: 49.9, documents: [planning, ppa]}
      conflicting: {value: 45, documents: [grid]}

