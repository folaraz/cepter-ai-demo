      lease_start_short: "1 Jan 2026"
      term_years: "35"
      first_export_year: "2029"
      operating_years: "40"
      lease_end_year: "2060"
      operating_end_year: "2069"
      shortfall_years_word: "nine"
      shortfall_years_word_cap: "Nine"
      shortfall_years: "9"
      lease_end_short: "31 Dec 2060"
  pre_commencement_conditions:
