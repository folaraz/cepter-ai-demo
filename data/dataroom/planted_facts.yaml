  - {type: PARTY_TO, from: "Brackenfield Solar Limited", to: Lease, role: tenant, paragraph: "lease:p1:¶1"}
  - {type: PARTY_TO, from: "John Hartley", to: Permit, role: landowner, paragraph: "planning:p1:¶2",
     note: "planning names him 'Mr J. Hartley'; consolidation must merge him with the lease's JOHN HARTLEY"}
  - {type: PARTY_TO, from: "Brackenfield Solar Limited", to: Permit, role: applicant, paragraph: "planning:p1:¶2",
     note: "planning says 'Ltd'; must merge with 'Limited'"}
  - {type: PARTY_TO, from: "Fenland Distribution Networks plc", to: GridConnection, role: network_operator, paragraph: "grid_offer:p1:¶2"}
  - {type: PARTY_TO, from: "Brackenfield Solar Limited", to: GridConnection, role: customer, paragraph: "grid_offer:p1:¶2"}
  - {type: PARTY_TO, from: "Brackenfield Solar Limited", to: OfftakeAgreement, role: generator, paragraph: "ppa:p1:¶1"}
  - {type: PARTY_TO, from: "Northwind Energy Supply Limited", to: OfftakeAgreement, role: buyer, paragraph: "ppa:p1:¶1"}
  - {type: COVERS, from: Lease, to: [9, 10, 11], paragraph: "lease:p1:¶3"}
  - {type: SITE_INCLUDES, from: Asset, to: [9, 10, 11], paragraph: "site_plan:p1:¶1"}
  - {type: CABLE_CROSSES, from: Asset, to: [14, 15], paragraph: "site_plan:p1:¶2"}
