# Answer key for the synthetic data room. Written by hand, never generated.
#
# Used by:
#   - evals/golden.jsonl         (the fact, edge, conflict and check items are derived from this)
#   - backend/tools/check_templates.py   (the "context" blocks render the fixture wording)
#   - tests that assert the pipeline finds every planted issue
#
# Paragraph IDs were produced by backend/tools/check_dataroom.py on the committed PDFs.

